services:
  backend:
    build: ./backend
    environment:
      APP_ORIGIN: http://localhost:3000
      DATABASE_PATH: /app/data/social-network.db
    ports:
      - "8080:8080"
    volumes:
      - social-data:/app/data
      - social-uploads:/app/uploads
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8080
    environment:
      BACKEND_URL: http://backend:8080
    depends_on:
      - backend
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  social-data:
  social-uploads:
